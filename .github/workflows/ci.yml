name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --console=plain

      # Signed release APK on main only. Until the keystore secrets exist (and
      # always on PRs, which get no secrets) the debug APK is uploaded instead.
      - name: Restore release keystore
        if: github.event_name == 'push' && env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - if: env.KEYSTORE_FILE != ''
        run: ./gradlew :app:assembleRelease --console=plain
      - if: env.KEYSTORE_FILE != ''
        uses: actions/upload-artifact@v7
        with:
          name: duck-viewer-release
          path: app/build/outputs/apk/release/app-release.apk
      - if: env.KEYSTORE_FILE == ''
        run: echo "::warning::No release keystore available; uploading the debug APK"
      - if: env.KEYSTORE_FILE == ''
        uses: actions/upload-artifact@v7
        with:
          name: duck-viewer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
